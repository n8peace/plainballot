name: Next election dates
# Every Monday, re-reads each state's official page and checks it still gives the same date
# (lib/next-election.ts), and checks any pull request that changes the dates. A failed run emails
# the repo owner; fix or remove that state's line.
on:
  pull_request:
    paths: [lib/next-election.ts, scripts/check-next-elections.ts]
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y poppler-utils > /dev/null
      - run: npm run check:elections
