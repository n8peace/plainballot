name: Next election dates
# Every Monday, re-reads each state's official page and checks it still gives the same date
# (lib/next-election.ts), and each ballot word's official source still has its snippet
# (lib/terms.ts). Also checks any pull request that changes them. A failed run emails the repo
# owner; fix or remove that line.
on:
  pull_request:
    paths: [lib/next-election.ts, lib/terms.ts, scripts/check-next-elections.ts, scripts/check-terms.ts]
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y poppler-utils > /dev/null
      - run: npm run check:elections
      - run: npm run check:terms
        if: success() || failure()
